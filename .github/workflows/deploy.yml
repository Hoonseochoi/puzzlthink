# Push to main → build with vinext and deploy to Cloudflare Workers (www.puzzlthink.com).
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and deploy
        run: npx vinext-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: |
          for p in /ko /en /ko/wallgo /ko/records; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://puzzlthink.fanmadefree.workers.dev$p")
            echo "$p $code"; [ "$code" = 200 ] || exit 1
          done
